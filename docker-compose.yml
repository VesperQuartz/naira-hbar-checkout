services:
  postgres:
    image: postgres:18-alpine
    container_name: naira-hbar-checkout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: naira_hbar_checkout
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql (not .../data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d naira_hbar_checkout"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
