[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200

# Formatter and lint are advisory for this template; the gates are
# `forge build` and `forge test`.
fmt = { line_length = 100, tab_width = 4, bracket_spacing = false }

[rpc_endpoints]
testnet = "https://testnet.hashio.io/api"
